  dobierz:
    status_doboru: rozstrzygniety
    metoda_doboru: kryterialny + zrodlowy (hybrydowy)
    warianty:
    - id: W1
      nazwa: Inspekcja kodu zrodlowego (grep/read)
      opis: Bezposrednie wczytanie modulow Python i weryfikacja deklarowanych komponentow
      dopasowanie: wysokie
    - id: W2
      nazwa: Uruchomienie serwera i testy funkcjonalne narzedzi MCP
      opis: Start serwera, wywolanie narzedzi, sprawdzenie odpowiedzi
      dopasowanie: wysokie
    - id: W3
      nazwa: Weryfikacja integralnosci skilli (verify_skills_integrity)
      opis: Wbudowane narzedzie serwera do sprawdzania spojnosci skilli
      dopasowanie: wysokie
    - id: W4
      nazwa: Porownanie .ai-kb/docs z kodem (audyt zgodnosci dokumentacji)
      opis: Sprawdzenie czy deklaracje w bazie wiedzy odpowiadaja implementacji
      dopasowanie: wysokie
    - id: W5
      nazwa: Analiza grafu zaleznosci przez Memgraph
      opis: Zapis relacji run'u i audyt ciaglosci grafu
      dopasowanie: srednie (opcjonalne, wymaga uruchomionego Memgraph)
    kryteria:
    - nazwa: Pokrycie celu (orkiestracja agentow AI w petli pipeline)
      waga: wysoka
      kryterium: Metoda weryfikuje wszystkie deklarowane komponenty celu
    - nazwa: Wiarygodnosc zrodlowa
      waga: wysoka
      kryterium: Metoda opiera sie na kodzie zrodlowym lub wbudowanych narzedziach
        serwera
    - nazwa: Powtarzalnosc
      waga: srednia
      kryterium: Metoda daje deterministyczny wynik
    - nazwa: Niski koszt
      waga: srednia
      kryterium: Metoda nie wymaga zewnetrznych serwisow (Memgraph, LLM API)
    porownanie: W1 (inspekcja kodu) - pokrycie wysokie, wiarygodnosc wysoka (kod =
      zrodlo prawdy), powtarzalnosc wysoka, koszt niski. W2 (testy funkcjonalne) -
      pokrycie wysokie, wiarygodnosc wysokie (realne dzialanie), powtarzalnosc wysoka,
      koszt niski (lokalne). W3 (verify_skills_integrity) - pokrycie srednie (tylko
      skille), wiarygodnosc wysokie (wbudowane), powtarzalnosc wysoka, koszt niski.
      W4 (audyt zgodnosci docs) - pokrycie wysokie (deklaracja vs implementacja),
      wiarygodnosc wysoka, powtarzalnosc wysoka, koszt niski. W5 (Memgraph) - pokrycie
      srednie (relacje), wiarygodnosc wysokie, powtarzalnosc wysoka, koszt sredni
      (wymaga Memgraph).
    rekomendacja:
      glowna: W1 + W2 + W4 (inspekcja kodu + testy funkcjonalne + audyt zgodnosci
        docs) - kombinacja daje pelne pokrycie celu bez zewnetrznych zaleznosci
      rezerwowa: W1 + W3 + W4 (bez uruchamiania serwera, tylko inspekcja statyczna)
        - gdy uruchomienie serwera niemozliwe
      uzasadnienie: W1 daje wiarygodnosc zrodlowa (kod = zrodlo prawdy implementacyjnej),
        W2 potwierdza realne dzialanie orkiestracji, W4 weryfikuje zgodnosc deklaracji
        z implementacja. Wszystkie metody lokalne, niskokosztowe, powtarzalne. W5
        pomijam jako opcjonalne (Memgraph nie jest wymagany do celu orkiestracji).
    ryzyka_i_warunki_rewizji:
      ryzyka:
      - Inspekcja kodu moze pominac bledy runtime niewidoczne w statycznym odczycie
      - Testy funkcjonalne wymagaja dzialajacego srodowiska (.venv)
      - Audyt zgodnosci docs zalezy od kompletnosci .ai-kb
      warunki_rewizji:
      - Jesli inspekcja kodu wykazuje rozjazd z deklaracja - przejsc do W2 dla potwierdzenia
      - Jesli testy funkcjonalne zawioda - przejsc do debugingu konkretnego narzedzia
    najblizszy_krok: Przejscie do stacji routing w celu ustalenia sciezki weryfikacji,
      nastepnie planuj z wybranymi metodami W1+W2+W4
