  planuj:
    cel: Sprawdzenie czy projekt Pipeline MCP Server realizuje deklarowany cel orkiestracji
      agentow AI w petli pipeline, z wykorzystaniem metod W1 (inspekcja kodu) + W2
      (testy funkcjonalne) + W4 (audyt zgodnosci docs)
    sytuacja: Projekt w fazie implementacja ukonczona, weryfikacja pozytywna (deklaracja
      w .ai-kb). Kod w .venv, serwer uruchamiany przez .venv/bin/python -m pipeline_mcp.server.
      Audyt prowadzony w pipeline doglebny.
    kroki:
    - id: K1
      nazwa: Weryfikacja strukturalna (P1) - inspekcja kodu zrodlowego
      opis: Wczytanie kluczowych modulow (server.py, stations.py, routing.py, quality_gate.py,
        envelope.py, auto_pilot.py, memgraph.py, skills_loader.py) i potwierdzenie
        obecnosci wszystkich deklarowanych komponentow celu
      podproblem: P1
      zasoby: narzedzia read/grep/exec
      kryteria_sukcesu: Wszystkie deklarowane komponenty (13 stacji, 3 sciezki, bramka,
        persystencja, orkiestracja hybrydowa, koperta, Memgraph, auto-pilot) potwierdzone
        w kodzie
    - id: K2
      nazwa: Weryfikacja funkcjonalna (P2) - uruchomienie serwera i testy narzedzi
        MCP
      opis: Uruchomienie serwera, wywolanie verify_skills_integrity, list_stations,
        sprawdzenie czy narzedzia orkiestracji (start_run, execute_station, get_next_station,
        quality_gate, close_run) dzialaja
      podproblem: P2
      zasoby: .venv, exec
      kryteria_sukcesu: Serwer startuje, verify_skills_integrity PASS, narzedzia orkiestracji
        zwracaja poprawne wyniki
    - id: K3
      nazwa: Audyt zgodnosci deklaracja-implementacja (P3)
      opis: Porownanie deklaracji w .ai-kb/00-overview.md i docs/ z rzeczywistym kodem
        (liczba modulow, narzedzi, stacji, skilli)
      podproblem: P3
      zasoby: read, grep
      kryteria_sukcesu: Rozbieznosci marginalne lub brak; kazda rozbieznosc udokumentowana
    - id: K4
      nazwa: Ewaluacja ex-post (P4) - ocena osiagalnosci celu w praktyce
      opis: Ocena czy cel orkiestracji jest realnie osiagalny (nie tylko deklarowany)
        - analiza ograniczen P1-P6 i ich wplywu na uzytecznosc
      podproblem: P4
      zasoby: wnioskowanie z K1-K3
      kryteria_sukcesu: Werdykt czy cel realizowany w pelni / czesciowo / nie
    zasoby:
    - typ: narzedzia
      opis: read, grep, exec, find_file_by_name
    - typ: srodowisko
      opis: .venv z instalacja -e .[all]
    - typ: zrodla
      opis: .ai-kb/, docs/, src/pipeline_mcp/
    ryzyka:
    - ryzyko: Serwer nie uruchomi sie przez brak zaleznosci lub konflikt wersji
      prawdopodobienstwo: niskie
      mitigacja: Sprawdzenie .venv i pyproject.toml przed startem
    - ryzyko: Inspekcja kodu pominie bledy runtime niewidoczne statycznie
      prawdopodobienstwo: srednie
      mitigacja: Uzupelnienie testem funkcjonalnym K2
    - ryzyko: Rozbieznosci docs-kod wynikaja z nieaktualnej dokumentacji a nie bledu
        kodu
      prawdopodobienstwo: srednie
      mitigacja: Traktowanie kodu jako zrodla prawdy implementacyjnej
    kryteria_sukcesu:
    - Wszystkie deklarowane komponenty celu potwierdzone w kodzie (K1)
    - Serwer uruchamia sie i narzedzia orkiestracji dzialaja (K2)
    - Zgodnosc .ai-kb/docs z kodem (K3)
    - 'Werdykt ewaluacji celu: realizowany w pelni / czesciowo / nie (K4)'
    punkty_kontrolne:
    - 'CP1: Po K1 - potwierdzenie strukturalne'
    - 'CP2: Po K2 - potwierdzenie funkcjonalne'
    - 'CP3: Po K3 - potwierdzenie zgodnosci docs'
    - 'CP4: Po K4 - werdykt koncowy celu'
