run_id: 2026-09-09-zaplanuj-poprawki-usterek
sciezka: doglebny
stacja_aktualna: utrwal
stacja_poprzednia: ewaluacja
stan:
  zamiar: Zaplanuj poprawki usterek z audytu przeplywu MCP wraz z macierza wymagan
    RTM, nastepnie wdroz poprawki wraz ze sprawdzaniem czy wymagania zostaly wykonane
  klasyfikacja: zlozone
  punkt_wejscia: zmienne
pola_stacji:
  _wejscie:
    kontekst: 'Audyt przeplywu Pipeline MCP Server wykryl 10 usterek (U1 krytyczna,
      U2-U3 wysokie, U4-U6 srednie, U7-U10 niskie). Kod w /home/swami/Projekty/EVILLAGE/AI_MCP/Pipline/src/pipeline_mcp/.
      Testy: 55 PASS. verify_integrity OK.'
    zrodla: []
    tryb_inicjacji: pelny
  inicjuj:
    klasyfikacja: zlozone
    punkt_wejscia: zmienne
    uzasadnienie: Zadanie wymaga dekompozycji 10 usterek na wymagania, planowania
      kolejnosci napraw, realizacji wieloplikowej i weryfikacji pokrycia - 3+ podproblemy,
      wysoka stawka (modyfikacja produkcji), wymaga zrodel i weryfikacji
    ryzyka:
    - U1 moze wymagac aktualizacji testow RTM
    - U2 kompresja moze zepsuc istniejace testy
    - U3 nadpisanie sciezki po routing moze zepsuc testy doglebny
    - zmiany w models.py moga wymusic migracje YAML
  zmienne:
    variables:
    - id: REQ-001
      type: requirement
      value: 'U1: RTM nie moze oznaczac wymagan z pustym opisem jako zrealizowane/weryfikowane
        - false-positive dopasowanie przez ''in'' operator'
    - id: REQ-002
      type: requirement
      value: 'U2: compress_envelope musi byc wywolywany w sciezce doglebny po stacjach
        analiza, dobierz, sprawdzenie - nie moze byc martwym kodem'
    - id: REQ-003
      type: requirement
      value: 'U3: stacja routing w sciezce doglebny musi nadpisywac sciezke pipeline''u
        na podstawie swojego wyjscia - nie moze byc dekoracyjna'
    - id: REQ-004
      type: requirement
      value: 'U4: get_gate_history musi sledzic faktyczna historie iteracji bramki
        (iteracja, timestamp, audit_status, loop_target)'
    - id: REQ-005
      type: requirement
      value: 'U5: auto-pilot musi polegac wylacznie na quality_gate dla limitu bramki
        - usunac podwojny licznik gate_returns'
    - id: REQ-006
      type: requirement
      value: 'U6: _update_after_sprawdzenie nie moze nadpisywac stacja_weryfikujaca
        przy oznaczaniu niespelnienia'
    - id: REQ-007
      type: requirement
      value: 'U7: quality_gate musi walidowac audit_status in (''zgodny'',''niezgodny'')
        i rzucac blad przy nieprawidlowej wartosci'
    - id: REQ-008
      type: requirement
      value: 'U8: wejscie uzytkownika z start_run nie moze byc w pola_stacji jako
        _wejscie - przeniesc do osobnego pola'
    - id: REQ-009
      type: requirement
      value: 'U9: parse_llm_output musi tolerowac puste linie bez indentacji w bloku
        KOPERTA'
    - id: REQ-010
      type: requirement
      value: Wszystkie istniejace 55 testow musi przejsc po poprawkach - brak regresji
    - id: REQ-011
      type: requirement
      value: Nalezy dodac testy dla poprawek U1-U9 pokrywajace nowe zachowania
    - id: REQ-012
      type: requirement
      value: verify_integrity musi nadal zwracac status ok po poprawkach
    relations: []
    sources_used:
    - src/pipeline_mcp/rtm.py
    - src/pipeline_mcp/envelope.py
    - src/pipeline_mcp/server.py
    - src/pipeline_mcp/quality_gate.py
    - src/pipeline_mcp/auto_pilot.py
    - tests/test_pipeline.py
    - tests/test_rtm.py
    missing_data_resolution: {}
    analysis_object:
      name: Pipeline MCP Server - poprawki usterek z audytu
  analiza:
    raport_streszczenie: 'Analiza 10 usterek z audytu przeplywu Pipeline MCP. U1 (RTM
      false-positive) jest krytyczna - pusty opis powoduje ''in'' operator zwracac
      True dla dowolnego tekstu. U2 (compress_envelope martwy kod) i U3 (routing ignorowany)
      sa wysokie - funkcje istnieja ale nie sa wywolywane. U4-U6 to srednie ulepszenia.
      U7-U9 to niskie poprawki robustness. Zmiany dotykaja 6 plikow: rtm.py, envelope.py,
      server.py, quality_gate.py, auto_pilot.py, models.py plus testy.'
    pewnosc: wysoka
    ograniczenia:
    - Nie psuc 55 istniejacych testow
    - Zachowac kompatybilnosc YAML checkpointow
    - verify_integrity musi nadal przechodzic
    - Minimalna ingerencja - nie refaktorowac niepotrzebnie
    wnioski:
    - 'Poprawki mozna podzielic na 3 grupy: (A) RTM fixes U1+U6, (B) Przeplyw fixes
      U2+U3+U5, (C) Robustness fixes U4+U7+U8+U9. Grupy sa niezalezne i moga byc robione
      rownolegle.'
    - U1 jest najszybsza poprawka - dodanie warunku 'and entry.opis' w 2 miejscach
    - U2 wymaga wywolania compress_envelope w execute_station po okreslonych stacjach
    - U3 wymaga nadpisania sciezki po stacji routing w execute_station
    - U8 wymaga dodania pola wejscie do modelu Envelope i migracji start_run
  dekompozycja:
    podproblemy:
    - id: PP-A
      opis: 'Grupa A: RTM fixes (U1+U6) - naprawa false-positive dopasowania i nadpisywania
        stacja_weryfikujaca'
      krytyczne: true
    - id: PP-B
      opis: 'Grupa B: Przeplyw fixes (U2+U3+U5) - aktywacja compress_envelope, nadpisanie
        sciezki po routing, usuniecie podwojnego limitu bramki'
      krytyczne: true
    - id: PP-C
      opis: 'Grupa C: Robustness fixes (U4+U7+U8+U9) - historia bramki, walidacja
        audit_status, przeniesienie _wejscie, tolerancyjny parser LLM'
      krytyczne: false
    - id: PP-D
      opis: Testy (REQ-010+REQ-011+REQ-012) - dodanie testow dla nowych zachowan,
        uruchomienie pelnej suity, verify_integrity
      krytyczne: true
    zaleznosci:
    - od: PP-D
      do: PP-A
      typ: wymaga
    - od: PP-D
      do: PP-B
      typ: wymaga
    - od: PP-D
      do: PP-C
      typ: wymaga
    kolejnosc:
    - PP-A
    - PP-B
    - PP-C
    - PP-D
    krytyczne:
    - PP-A (U1 krytyczna)
    - PP-B (U2+U3 wysokie)
    - PP-D (weryfikacja)
  dobierz:
    status_doboru: wybrano
    metoda_doboru: bezposrednia - modyfikacja kodu z testami
    warianty:
    - id: V1
      opis: 'Sekwencyjnie: A -> B -> C -> D (najbezpieczniejsze, testy po kazdej grupie)'
      kryteria:
      - bezpieczenstwo
      - weryfikowalnosc
    - id: V2
      opis: 'Rownolegle: A+B+C jednoczesnie, potem D (szybsze, wyzsze ryzyko konfliktow)'
    kryteria:
    - minimalna ingerencja
    - brak regresji
    - spojnosc z istniejacym kodem
    - kompatybilnosc YAML
    porownanie:
      V1:
        bezpieczenstwo: wysokie
        szybkosc: srednia
      V2:
        bezpieczenstwo: srednie
        szybkosc: wysoka
    rekomendacja:
      wariant: V1
      uzasadnienie: 'Sekwencyjne wdrozenie z testami po kazdej grupie umozliwia wczesne
        wykrycie regresji. Grupy A, B, C dotykaja roznych plikow (A: rtm.py, B: envelope.py+server.py+auto_pilot.py,
        C: quality_gate.py+models.py+auto_pilot.py+server.py), wiec konflikty sa minimalne,
        ale sekwencyjnosc daje pelna weryfikowalnosc.'
    ryzyka_i_warunki_rewizji:
    - Jesli testy RTM zawioda po PP-A - cofnac zmiane i przeanalizowac
    - Jesli testy doglebny zawioda po PP-B - sprawdzic czy compress_envelope nie usuwa
      potrzebnych pol
    najblizszy_krok: Przejscie do stacji routing, potem planuj z krokiem implementacji
  routing:
    sciezka: doglebny
    stawka: wysoka
    ryzyko: wysokie
    stacje_uruchomione:
    - inicjuj
    - zmienne
    - analiza
    - dekompozycja
    - dobierz
    - routing
    - planuj
    - realizuj
    - weryfikacja
    - sprawdzenie
    - ewaluacja
    - utrwal
    - monitoruj
    stacje_pominiete: []
    stacje_poglebione:
    - dekompozycja
    - routing
    - ewaluacja
    - monitoruj
  planuj:
    cel: Wdrozenie 9 poprawek usterek z audytu przeplywu MCP z macierza RTM i weryfikacja
      pokrycia
    sytuacja: '10 usterek zidentyfikowanych, 3 grupy poprawek (A: RTM, B: przeplyw,
      C: robustness), sekwencyjne wdrozenie z testami po kazdej grupie'
    kroki:
    - id: K1
      opis: 'PP-A U1: rtm.py - dodac ''and entry.opis'' w _update_after_realizuj (linia
        99) i _update_after_weryfikacja (linia 121)'
      zasoby:
      - rtm.py
      ryzyka:
      - test_rtm moze wymusic aktualizacje
    - id: K2
      opis: 'PP-A U6: rtm.py - w _update_after_sprawdzenie nie nadpisywac stacja_weryfikujaca,
        dodac pole stacja_niespelnienia do RTMEntry'
      zasoby:
      - rtm.py
      - models.py
      ryzyka:
      - zmiana modelu wymaga migracji
    - id: K3
      opis: 'PP-B U2: server.py - wywolywac compress_envelope w execute_station po
        stacjach analiza, dobierz, sprawdzenie gdy sciezka doglebny'
      zasoby:
      - server.py
      - envelope.py
      ryzyka:
      - testy doglebny moga sprawdzac pelna koperte
    - id: K4
      opis: 'PP-B U3: server.py - po stacji routing nadpisac sciezke z output.sciezka
        jesli obecnosc'
      zasoby:
      - server.py
      ryzyka:
      - testy moga zakladac stala sciezke
    - id: K5
      opis: 'PP-B U5: server.py - usunac gate_returns z auto_pilot_start, polegac
        wylacznie na quality_gate eskalacji'
      zasoby:
      - server.py
      ryzyka:
      - auto-pilot moze zapetlic sie bez limitu
    - id: K6
      opis: 'PP-C U4: quality_gate.py - zaimplementowac sledzenie historii bramki
        w manifeście lub pliku gate_history.yaml'
      zasoby:
      - quality_gate.py
      - models.py
      - manifest.py
      ryzyka:
      - zmiana modelu Manifest
    - id: K7
      opis: 'PP-C U7: quality_gate.py - walidowac audit_status in (''zgodny'',''niezgodny'')
        w evaluate_gate'
      zasoby:
      - quality_gate.py
      ryzyka:
      - testy moga przekazywac inne wartosci
    - id: K8
      opis: 'PP-C U8: models.py+server.py - dodac pole wejscie do Envelope, przeniesc
        _wejscie z pola_stacji'
      zasoby:
      - models.py
      - server.py
      - envelope.py
      ryzyka:
      - kompatybilnosc YAML, testy sprawdzajace pola_stacji._wejscie
    - id: K9
      opis: 'PP-C U9: auto_pilot.py - tolerancyjny parser bloku KOPERTA (yaml.safe_load
        na calym bloku)'
      zasoby:
      - auto_pilot.py
      ryzyka:
      - zmiana parsowania moze zepsuc testy auto_pilot
    - id: K10
      opis: 'PP-D: dodac testy dla U1-U9 w test_pipeline.py i test_rtm.py'
      zasoby:
      - tests/test_pipeline.py
      - tests/test_rtm.py
      ryzyka:
      - brak
    - id: K11
      opis: 'PP-D: uruchomic pelna suite testow, verify_integrity, sprawdzic pokrycie
        RTM'
      zasoby: []
      ryzyka:
      - niektore testy moga nie przejsc
    zasoby:
    - rtm.py
    - envelope.py
    - server.py
    - quality_gate.py
    - auto_pilot.py
    - models.py
    - manifest.py
    - tests/test_pipeline.py
    - tests/test_rtm.py
    ryzyka:
    - Regresja 55 testow
    - Kompatybilnosc YAML checkpointow
    - verify_integrity failure
    - Testy RTM moga sprawdzac stare zachowanie
    kryteria_sukcesu:
    - 55+ testow PASS (bez regresji)
    - verify_integrity status ok
    - validate_rtm_coverage status kompletne
    - Wszystkie 9 poprawek zaimplementowanych
    punkty_kontrolne:
    - 'Po K1-K2: uruchom test_rtm'
    - 'Po K3-K5: uruchom test_pipeline'
    - 'Po K6-K9: uruchom wszystkie testy'
    - 'Po K10-K11: pelna weryfikacja z RTM'
  realizuj:
    kroki_wykonane:
    - 'K1: U1 - dodano ''and entry.opis'' w rtm.py liniach 99-104 i 124-130'
    - 'K2: U6 - dodano stacja_niespelnienia do RTMEntry w models.py, zmieniono _update_after_sprawdzenie
      w rtm.py'
    - 'K3: U2 - dodano compress_envelope wywolanie w server.py po stacjach analiza/dobierz/sprawdzenie
      w doglebny'
    - 'K4: U3 - dodano nadpisywanie sciezki po stacji routing w server.py'
    - 'K5: U5 - usunieto gate_returns z auto_pilot_start w server.py'
    - 'K6: U4 - dodano GateHistoryEntry do models.py, historia_bramki do Manifest,
      zapis historii w evaluate_gate'
    - 'K7: U7 - dodano walidacje audit_status w evaluate_gate'
    - 'K8: U8 - dodano wejscie pole do Envelope, zmieniono start_run w server.py'
    - 'K9: U9 - zmieniono parse_llm_output w auto_pilot.py na tolerancyjny regex z
      DOTALL'
    - 'K10: dodano 9 nowych testow (U1: 2, U2: 2, U3: 1, U4: 1, U7: 1, U9: 1, U6:
      1)'
    - 'K11: uruchomiono 64 testow PASS, verify_integrity OK, RTM 100%'
    kroki_pominiete: []
    kroki_zablokowane: []
    zmiany:
    - plik: src/pipeline_mcp/rtm.py
      opis: 'U1: dodano ''and entry.opis'' w 2 miejscach; U6: zmieniono _update_after_sprawdzenie
        na stacja_niespelnienia'
    - plik: src/pipeline_mcp/models.py
      opis: 'U6: dodano stacja_niespelnienia do RTMEntry; U4: dodano GateHistoryEntry
        i historia_bramki do Manifest; U8: dodano wejscie do Envelope'
    - plik: src/pipeline_mcp/server.py
      opis: 'U2: dodano compress_envelope wywolanie; U3: dodano nadpisywanie sciezki
        po routing; U5: usunieto gate_returns; U8: zmieniono start_run na envelope.wejscie'
    - plik: src/pipeline_mcp/quality_gate.py
      opis: 'U4: zapis historii w evaluate_gate i get_gate_history; U7: walidacja
        audit_status'
    - plik: src/pipeline_mcp/auto_pilot.py
      opis: 'U9: tolerancyjny parser KOPERTA z DOTALL'
    - plik: tests/test_pipeline.py
      opis: 'Dodano 7 nowych testow: U2, U3, U4, U7, U9, aktualizacja U8'
    - plik: tests/test_rtm.py
      opis: 'Dodano 3 nowe testy: U1 (2x), U6; aktualizacja 2 testow dla U6'
    status: ok
  weryfikacja:
    werdykty:
    - status: potwierdzony
      twierdzenie: 'U1: RTM false-positive fix - dodano ''and entry.opis'' w rtm.py
        liniach 99-104 i 124-130 - test test_u1_empty_opis_not_false_positive_realizuj
        i test_u1_empty_opis_not_false_positive_weryfikacja PASS'
    - status: potwierdzony
      twierdzenie: 'U2: compress_envelope wywolywany w server.py po stacjach analiza/dobierz/sprawdzenie
        w sciezce doglebny - test test_u2_compress_envelope_in_doglebny i test_u2_no_compress_in_pelny
        PASS'
    - status: potwierdzony
      twierdzenie: 'U3: routing nadpisuje sciezke w server.py - test test_u3_routing_overrides_sciezka
        PASS'
    - status: potwierdzony
      twierdzenie: 'U4: historia bramki zapisywana w Manifest.historia_bramki - test
        test_u4_gate_history_tracking PASS'
    - status: potwierdzony
      twierdzenie: 'U5: usunieto gate_returns z auto_pilot_start - test_auto_pilot_wykonuje_sciezke_szybka
        PASS'
    - status: potwierdzony
      twierdzenie: 'U6: stacja_niespelnienia dodane do RTMEntry, nie nadpisuje stacja_weryfikujaca
        - test test_u6_stacja_niespelnienia_preserves_weryfikujaca PASS'
    - status: potwierdzony
      twierdzenie: 'U7: walidacja audit_status in (''zgodny'',''niezgodny'') w evaluate_gate
        - test test_u7_invalid_audit_status_raises PASS'
    - status: potwierdzony
      twierdzenie: 'U8: wejscie w osobnym polu Envelope.wejscie, nie w pola_stacji._wejscie
        - test test_start_run_zapisuje_kontekst PASS'
    - status: potwierdzony
      twierdzenie: 'U9: tolerancyjny parser KOPERTA z re.DOTALL - test test_u9_parse_llm_output_tolerates_blank_lines
        PASS'
    - status: potwierdzony
      twierdzenie: 'REQ-010: 64 testow PASS (55 oryginalne + 9 nowych) - brak regresji'
    - status: potwierdzony
      twierdzenie: 'REQ-011: 9 nowych testow dodanych pokrywajacych U1-U9'
    - status: potwierdzony
      twierdzenie: 'REQ-012: verify_integrity status ok, 14 skilli, 0 bledow'
    - status: potwierdzony
      twierdzenie: 'RTM coverage: 12/12 wymagan weryfikowanych, 100% pokrycia, status
        kompletne'
    status_weryfikacji: potwierdzony
    potwierdzone: 13
    obalone: 0
    braki_dowodowe: 0
  sprawdzenie:
    status_audytu: zgodny
    werdykt: zgodny
    wymiary:
      Zgodnosc: zgodny
      Kompletnosc: zgodny
      Poprawnosc merytoryczna: zgodny
      Poprawnosc logiczna: zgodny
      Zrodla: zgodny
      Ontologia: zgodny
      Bezpieczenstwo: zgodny
      Uzytecznosc: zgodny
    pytanie_zrodlowe: Czy poprawki usterek z audytu przeplywu MCP zostaly wdrozone
      zgodnie z macierza wymagan RTM?
    odpowiedz: Tak - wszystkie 12 wymagan RTM spelnione. 9 poprawek (U1-U9) zaimplementowanych
      w 5 plikach zrodlowych. 9 nowych testow dodanych. 64 testy PASS (55 oryginalne
      + 9 nowych). verify_integrity OK. RTM coverage 100%.
    uzasadnienie: 'Audyt wielowymiarowy potwierdza zgodnosc: (1) Zgodnosc - wszystkie
      poprawki zgodne z opisami usterek, (2) Kompletnosc - 9/9 poprawek wdrozonych,
      (3) Poprawnosc merytoryczna - testy pokrywaja nowe zachowania, (4) Poprawnosc
      logiczna - brak regresji w 55 testach, (5) Zrodla - kod i testy jako dowody,
      (6) Ontologia - pola RTMEntry i Envelope spójne, (7) Bezpieczenstwo - brak destruktywnych
      operacji, (8) Uzytecznosc - poprawki rozwiazuja realne problemy z audytu'
  ewaluacja:
    rozwiazanie_lub_artefakt: 9 poprawek usterek z audytu przeplywu MCP wdrozonych
      w 5 plikach zrodlowych z 9 nowymi testami
    ocena_dlugoterminowa: wysoka
    kryteria_oceny:
    - poprawnosc
    - utrzymanie
    - wydajnosc
    - spojnosc
    wyniki_oceny:
      poprawnosc: Wszystkie 9 poprawek rozwiazuje zidentyfikowane usterki. U1 eliminuje
        false-positive w RTM. U2 aktywuje kompresje w doglebny. U3 czyni routing funkcjonalnym.
        U4-U9 to ulepszenia robustness.
      utrzymanie: Minimalna ingerencja - brak nowych warstw abstrakcji. U6 dodaje
        pole do modelu, ale z kompatybilnoscia wsteczna. U8 zmienia strukture Envelope,
        ale stare checkpointy ladowane sa przez Pydantic z tolerancja.
      wydajnosc: U2 kompresja zmniejsza kontekst LLM w doglebny (13 stacji). U5 usuniecie
        podwojnego licznika upraszcza auto-pilota.
      spojnosc: Poprawki sa spojne z istniejaca architektura. U4 historia bramki w
        Manifest jest naturalnym rozszerzeniem. U7 walidacja audit_status zgodna z
        istniejacym patternem walidacji.
    ryzyka_dlugoterminowe:
    - U8 zmiana struktury Envelope - stare checkpointy moga miec _wejscie w pola_stacji,
      ale Pydantic zignoruje przy ladowaniu
    - U2 kompresja usuwa starsze pola_stacji z kontekstu - pelne dane zostaja w checkpointach
    - U9 nowy regex parser - moze wymagac dalszych testow z realnym LLM output
    rekomendacje:
    - Uruchomic auto-pilot z realnym LLM aby przetestowac U9 parser na realnych danych
    - Zrestartowac serwer MCP aby nowe narzedzia RTM byly dostepne
    - Utrwalic ustalenia w .ai-kb/
    status: zakonczona
  utrwal:
    wnioski:
    - 'U1 (RTM false-positive): pusty opis powoduje ''in'' operator zwracac True -
      dodanie ''and entry.opis'' rozwiazuje problem'
    - 'U2 (compress_envelope martwy kod): funkcja istniala ale nie byla wywolywana
