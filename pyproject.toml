[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pipeline-mcp"
version = "0.1.0"
description = "Samodzielny serwer MCP orkiestrujacy dzialanie agentow AI w petli pipeline"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "EVILLAGE" }]
dependencies = [
    "fastmcp>=2.0.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
memgraph = ["neo4j>=5.0.0"]
openai = ["openai>=1.0.0"]
anthropic = ["anthropic>=0.40.0"]
local = ["openai>=1.0.0"]
all = ["neo4j>=5.0.0", "openai>=1.0.0", "anthropic>=0.40.0"]
dev = ["pytest>=8.0.0"]

[project.scripts]
pipeline-mcp = "pipeline_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/pipeline_mcp"]

[tool.hatch.build.targets.wheel.force-include]
"src/pipeline_mcp/skills" = "pipeline_mcp/skills"
