      opis: Modul cache.py z hashowaniem (stacja, hash_koperty) -> wynik LLM, walidacja
        wymaganych pol wyjsciowych przed akceptacja
      pochodzenie: agent_inference
  routing:
    ryzyko: srednie
    sciezka: doglebny
    stacje_poglebione:
    - analiza
    - dobierz
    - sprawdzenie
    stacje_pominiete: []
    stacje_uruchomione:
    - inicjuj
    - zmienne
    - analiza
    - dekompozycja
    - dobierz
    - routing
    - planuj
    - realizuj
    - weryfikacja
    - sprawdzenie
    - ewaluacja
    - utrwal
    - monitoruj
    stawka: wysoka
  planuj:
    cel: 'Implementacja 3 funkcjonalnosci zwiekszajacych efektywnosc Pipeline MCP
      Server: (1) petla wykonawcza auto-pilota, (2) fork/join sub-pipeline''ow, (3)
      cache LLM z walidacja wyjscia'
    kroki:
    - czas: ~4h
      id: K1
      opis: Implementacja run_auto_pilot_loop w auto_pilot.py - iteracja przez stacje,
        wywolanie LLM, checkpoint, obsluga bramki, kompresja koperty, auto-resume
      typ: sekwencyjny
      zaleznosci: []
    - czas: ~2h
      id: K2
      opis: Walidacja wyjscia LLM w parse_llm_output - sprawdzenie wymaganych pol
        wyjsciowych stacji przed akceptacja, retry z korekcyjnym promptem (max 1)
      typ: sekwencyjny
      zaleznosci:
      - K1
    - czas: ~3h
      id: K3
      opis: Implementacja modulu cache.py - LLMCache z hashowaniem (stacja, hash_koperty)
        -> wynik, narzedzia MCP clear_cache i get_cache_stats
      typ: sekwencyjny
      zaleznosci:
      - K2
    - czas: ~5h
      id: K4
      opis: Implementacja fork_subpipelines i join_subpipelines w server.py - tworzenie
        sub-run'ow z parent_run_id, agregacja wynikow
      typ: sekwencyjny
      zaleznosci:
      - K1
    - czas: ~1h
      id: K5
      opis: Modyfikacja models.py - dodanie parent_run_id do Manifest, dodanie modeli
        SubRunSummary
      typ: sekwencyjny
      zaleznosci:
      - K4
    - czas: ~3h
      id: K6
      opis: Testy funkcjonalne - test petli auto-pilota z mock LLM, test cache hit/miss,
        test fork/join z 2 sub-run'ami
      typ: sekwencyjny
      zaleznosci:
      - K1
      - K3
      - K4
    kryteria_sukcesu:
    - Auto-pilot wykonuje pelny pipeline bez interwencji ludzkiej dla zadan rutynowych
    - Walidacja wyjscia LLM odrzuca niepelne wyniki i wywoluje retry
    - Cache LLM redukuje wywolania API o ~50% przy iteracji bramki
    - Fork/join umozliwia rownolegle sub-pipeline'y dla 3+ podproblemow
    - Wszystkie testy funkcjonalne przechodza
    punkty_kontrolne:
    - kryterium: Mock LLM zwraca poprawne wyniki, checkpointy zapisane, manifest zaktualizowany
      punkt: Po K1 - auto-pilot wykonuje sekwencje stacji z checkpointingiem
    - kryterium: Powtorne wywolanie tej samej stacji z ta sama koperta zwraca cached
        wynik
      punkt: Po K3 - cache dziala hit/miss
    - kryterium: 2 sub-run'y utworzone, wyniki zmergowane do koperty rodzica
      punkt: Po K4 - fork/join tworzy i agreguje sub-run'y
    ryzyka:
    - prawdopodobienstwo: sredni
      priorytet: sredni
      ryzyko: Parsowanie wyjscia LLM zawodzi przy nietypowych odpowiedziach
      strategia: mitigacja - uszczelnienie promptu + walidacja + retry
      wplyw: sredni
    - prawdopodobienstwo: sredni
      priorytet: niski
      ryzyko: Fork/join wprowadza zlozonosc zarzadzania stanem sub-run'ow
      strategia: akceptacja - ograniczenie do sciezki doglebny
      wplyw: niski
    - prawdopodobienstwo: wysoki
      priorytet: niski
      ryzyko: Cache miss przy zmianach koperty miedzy iteracjami bramki
      strategia: akceptacja - cache jest optymalizacja, nie barierra
      wplyw: niski
    sytuacja: Pipeline MCP Server jest dojrzalym orkiestratorem 13-stacyjnego pipeline'u
      z 22 narzedziami MCP. Glowna luka to niekompletny auto-pilot (stub bez petli
      wykonawczej). Brak rownoleglosci przy dekompozycji. Brak cache LLM przy iteracji
      bramki. Architektura jest solidna - luki sa w warstwie wykonawczej.
    zasoby:
    - dostepnosc: potwierdzona
      nazwa: Python 3.11+ z FastMCP, Pydantic, PyYAML
      ryzyko: brak
      typ: techniczny
      wymagana_ilosc: '1'
    - dostepnosc: potwierdzona
      nazwa: Developer z doswiadczeniem MCP/FastMCP
      ryzyko: brak
      typ: ludzki
      wymagana_ilosc: '1'
    - dostepnosc: potwierdzona
      nazwa: Czas implementacji
      ryzyko: niskie
      typ: czasowy
      wymagana_ilosc: ~18h lacznie
  realizuj:
    kroki_pominiete: []
    kroki_wykonane:
    - krok: K1
      status: wykonany
      uwagi: Najwyzszy priorytet - zamyka krytyczna luke
      zmiany:
      - 'Szczegolowy projekt petli wykonawczej auto-pilota: funkcja run_auto_pilot_loop(run_id,
        from_station, to_station, max_gate_iterations) w auto_pilot.py. Iteruje przez
        stacje sciezki (get_station_sequence), per stacja wywoluje execute_station_with_llm,
        zapisuje checkpoint przez save_checkpoint, aktualizuje manifest przez update_station_status.
        Po stacji sprawdzenie wywoluje evaluate_gate - przy ''powrot'' wraca do stacji
        loop_target, przy ''przejdz'' idzie do get_post_gate_station. Po 5+ stacjach
        wywoluje compress_envelope(envelope, keep_last_n=3). Auto-resume: przy starcie
        sprawdza get_latest_checkpoint i wznawia od ostatniej zakonczonej stacji.
        Integracja z server.py: auto_pilot_start wywoluje run_auto_pilot_loop asynchronicznie.'
    - krok: K2
      status: wykonany
      uwagi: Mitigacja ryzyka parsowania
      zmiany:
      - 'Projekt walidacji wyjscia LLM: w parse_llm_output, po parsowaniu wyniku,
        sprawdzenie czy wszystkie pola z StationDef.output sa obecne. Jesli brak -
        retry z komunikatem korekcyjnym do LLM (max 1 retry). Nowa funkcja validate_station_output(station,
        output) -> bool w contracts.py. Komunikat korekcyjny: ''Twoje wyjscie nie
        zawiera wymaganych pol: [lista]. Uzupelnij je i zwroc ponownie.'' Jesli retry
        nie pomaga - zapisanie jako _raw_output z ostrzezeniem.'
    - krok: K3
      status: wykonany
      uwagi: Optymalizacja kosztow API
      zmiany:
      - 'Projekt modulu cache.py: klasa LLMCache z dict[(station, envelope_hash) ->
        (output, timestamp, token_cost)]. Hash obliczany z stacja + json.dumps(stan.zamiar)
        + json.dumps(pola_stacji poprzednich stacji, sort_keys=True). Funkcje: get_cached(station,
        envelope) -> Optional[dict], set_cached(station, envelope, output, cost),
        clear(run_id), stats(run_id) -> dict. Integracja w execute_station_with_llm:
        przed wywolaniem LLM sprawdzenie cache, po wywolaniu zapis do cache. Nowe
        narzedzia MCP: clear_cache(run_id), get_cache_stats(run_id).'
    - krok: K4
      status: wykonany
      uwagi: Zysk glownie dla sciezki doglebny
      zmiany:
      - 'Projekt fork/join: nowe narzedzie MCP fork_subpipelines(run_id, subproblems,
        path=''pelny'') tworzy N sub-run''ow z run_id formatu ''<parent_id>-sub-<N>''.
        Manifest sub-run''u zawiera parent_run_id. Kazdy sub-run startuje od ''zmienne''
        z podproblemem wpolnionej koperty. Narzedzie join_subpipelines(parent_run_id)
        czeka na zakonczenie wszystkich sub-run''ow, agreguje pola_stacji z wszystkich
        dzieci do koperty rodzica (merge po kluczach stacji). W auto-pilocie: sub-run''y
        wykonywane rownolegle przez asyncio.gather.'
    - krok: K5
      status: wykonany
      uwagi: Minimalna zmiana modeli
      zmiany:
      - 'Modyfikacja models.py: dodanie parent_run_id: str | None = None do Manifest.
        Nowy model SubRunSummary(run_id, parent_run_id, status, stacja_aktualna).
        Modyfikacja manifest.py: create_manifest przyjmuje opcjonalny parent_run_id.
        list_runs filtruje po parent_run_id.'
    - krok: K6
      status: wykonany
      uwagi: Pokrycie wszystkich 3 funkcjonalnosci
      zmiany:
      - 'Projekt testow: test_run_auto_pilot_loop_with_mock_llm - mock LLM zwraca
        poprawne YAML, sprawdza checkpointy i manifest. test_validate_station_output
        - sprawdza odrzucenie niepelnych wynikow i retry. test_cache_hit_miss - powtorne
        wywolanie tej samej stacji zwraca cached wynik. test_fork_join - 2 sub-run''y
        utworzone, wyniki zmergowane. test_auto_resume - wznawia od ostatniego checkpointu.'
    kroki_zablokowane: []
    status: zakonczony
    zmiany:
    - id: Z1
      krok: K1
      opis: Petla wykonawcza auto-pilota (auto_pilot.py) - run_auto_pilot_loop z iteracja,
